<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D VR Browser</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin:0; font-family:Arial; background:#111; color:white; }
    #bar {
      position:fixed; top:10px; left:10px; right:10px;
      z-index:10; display:flex; gap:8px;
    }
    input { flex:1; padding:12px; font-size:16px; }
    button { padding:12px; font-size:16px; }
  </style>
</head>
<body>

<div id="bar">
  <input id="url" placeholder="Type website, like https://example.com">
  <button onclick="go()">Go</button>
</div>

<a-scene>
  <a-sky color="#101827"></a-sky>

  <a-plane position="0 1.6 -3" width="4" height="2.3" color="#222"></a-plane>
  <a-text id="screenText"
          value="3D VR Browser\nType a website above.\nSome sites will open in a new tab."
          position="-1.8 2.1 -2.9"
          width="3.5"
          color="white"></a-text>

  <a-box position="0 0.5 -3" width="4.2" height="0.1" depth="0.2" color="#555"></a-box>

  <a-camera position="0 1.6 0"></a-camera>
</a-scene>

<script>
function go() {
  let url = document.getElementById("url").value.trim();

  if (!url) return;

  if (!url.startsWith("http://") && !url.startsWith("https://")) {
    url = "https://" + url;
  }

  document.getElementById("screenText").setAttribute(
    "value",
    "Opening:\n" + url + "\n\nIf it does not show inside VR,\nit opened in a new tab."
  );

  window.open(url, "_blank");
}
</script>

</body>
</html>
